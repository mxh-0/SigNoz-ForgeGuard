# SignozForge Observer — Simple Docker Compose (no SigNoz)
# Use this for quick deployment without observability
#
# Usage:
#   docker compose -f docker-compose.simple.yml up -d
#
# Access:
#   - Frontend:  http://localhost:5173
#   - Backend:   http://localhost:8000

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: signozforge-backend
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=https://api.groq.com/openai/v1
      - LLM_MODEL=llama-3.3-70b-versatile
      - LLM_TEMPERATURE=0.2
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8000
      # Telemetry disabled (no SigNoz)
      - OTEL_EXPORTER_OTLP_ENDPOINT=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: signozforge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
